---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  interval: 30m
  chart:
    spec:
      chart: volsync
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    # The snapshot controller that Volsync's Snapshot copyMethod needs is
    # the one csi-driver-nfs deploys (externalSnapshotter.enabled). This used
    # to name the separate piraeus `snapshot-controller` release, which is
    # being retired because both releases deploy the same Deployment.
    - name: csi-driver-nfs
      namespace: storage
  values:
    manageCRDs: true
    image:
      # https://github.com/backube/volsync/issues/828
      repository: &image quay.io/backube/volsync
      tag: &tag ""
    rclone:
      repository: *image
      tag: *tag
    restic:
      repository: *image
      tag: *tag
    metrics:
      disableAuth: true
