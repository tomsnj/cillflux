---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-shared-storage
  namespace: forgejo
spec:
  sourcePVC: gitea-shared-storage-local
  trigger:
    schedule: "0 3 * * *"
  restic:
    copyMethod: Direct
    pruneIntervalDays: 7
    repository: volsync-gitea-shared-storage
    storageClassName: gsks1
    cacheStorageClassName: local-hostpath
    # Node-local source: the mover must read files owned by Forgejo's uid.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    retain:
      daily: 7
      weekly: 4
      monthly: 3
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: postgres-forgejo-pgdata
  namespace: forgejo
spec:
  sourcePVC: postgres-forgejo-local-instance1-gfzm-pgdata
  trigger:
    schedule: "0 3 * * *"
  restic:
    copyMethod: Direct
    pruneIntervalDays: 7
    repository: volsync-postgres-forgejo-pgdata
    storageClassName: gsks1
    cacheStorageClassName: local-hostpath
    # Node-local source: PGDATA is 0700 owned by PGO's postgres uid (26).
    moverSecurityContext:
      runAsUser: 26
      runAsGroup: 26
    retain:
      daily: 7
      weekly: 4
      monthly: 3
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: postgres-forgejo-repo1
  namespace: forgejo
spec:
  sourcePVC: postgres-forgejo-local-repo1
  trigger:
    schedule: "0 3 * * *"
  restic:
    copyMethod: Direct
    pruneIntervalDays: 7
    repository: volsync-postgres-forgejo-repo1
    storageClassName: gsks1
    cacheStorageClassName: local-hostpath
    retain:
      daily: 7
      weekly: 4
      monthly: 3
