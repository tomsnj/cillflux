---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 10m
  chart:
    spec:
      chart: forgejo
      version: ">=17.0.0 <18.0.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
  values:
    # ── Replica / deployment ──────────────────────────────────────────────────
    replicaCount: 1

    # ── Admin user ────────────────────────────────────────────────────────────
    gitea:
      admin:
        username: fjmaster
        # Password injected from SOPS secret via env (secret key is
        # always "password" - the chart hardcodes this, existingSecretKey
        # is not a real option despite appearing in older docs)
        existingSecret: forgejo-admin-secret
        # Never let the chart reset the live admin password back to
        # whatever's in forgejo-admin-secret on pod restart - the
        # chart's own default (keepUpdated) does exactly that.
        passwordMode: initialOnlyNoReset

      # ── app.ini config ──────────────────────────────────────────────────────
      config:
        server:
          DOMAIN: susan.gs-farm.net
          ROOT_URL: https://susan.gs-farm.net
          SSH_DOMAIN: susan.gs-farm.net
          SSH_PORT: 22
          HTTP_PORT: 3000

        database:
          DB_TYPE: postgres
          # HOST/NAME/USER/PASSWD injected via additionalConfigFromEnvs below
          SSL_MODE: require

        service:
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: true
          ALLOW_ONLY_INTERNAL_REGISTRATION: false

        security:
          INSTALL_LOCK: true

        cache:
          ADAPTER: memory

        session:
          PROVIDER: memory

        queue:
          TYPE: memory

        mailer:
          ENABLED: true
          PROTOCOL: smtp+starttls
          SMTP_ADDR: smtp.gmail.com
          SMTP_PORT: 587
          FROM: "Forgejo <tfs05jhu@gmail.com>"
          USER: tfs05jhu@gmail.com

      # Inject PGO-generated DB credentials as env vars → app.ini
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__HOST
          valueFrom:
            secretKeyRef:
              name: postgres-forgejo-pguser-forgejo
              key: host
        - name: FORGEJO__DATABASE__NAME
          valueFrom:
            secretKeyRef:
              name: postgres-forgejo-pguser-forgejo
              key: dbname
        - name: FORGEJO__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: postgres-forgejo-pguser-forgejo
              key: user
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: postgres-forgejo-pguser-forgejo
              key: password
        - name: FORGEJO__MAILER__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-admin-secret
              key: gmailAppPassword

    # ── Persistence ───────────────────────────────────────────────────────────
    persistence:
      enabled: true
      storageClass: gsks1
      size: 20Gi
      accessModes:
        - ReadWriteOnce

    # ── Disable built-in DB subcharts ─────────────────────────────────────────
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    redis-cluster:
      enabled: false

    # ── Services ──────────────────────────────────────────────────────────────
    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    # ── Ingress ────────────────────────────────────────────────────────────────
    # Both internal (susan-int) and external (susan) ingresses are managed as
    # standalone manifests (ingress-internal.yaml / ingress-external.yaml),
    # not via the chart - the chart's own ingress/extraIngress values only
    # ever produced a third, non-functional Ingress here (no valid
    # ingressClassName, no address assigned) and chart v14+ dropped
    # extraIngress support entirely anyway.
    ingress:
      enabled: false
