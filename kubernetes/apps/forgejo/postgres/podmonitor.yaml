# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cpgo-postgres-forgejo
  namespace: forgejo
spec:
  jobLabel: cpgo-postgres-forgejo
  podMetricsEndpoints:
    - honorLabels: true
      path: /metrics
      port: exporter
      relabelings:
        - sourceLabels:
            [
              "__meta_kubernetes_namespace",
              "__meta_kubernetes_pod_label_postgres_operator_crunchydata_com_cluster",
            ]
          targetLabel: pg_cluster
          separator: "/"
          replacement: "$1$2"
        - sourceLabels:
            [
              __meta_kubernetes_pod_label_postgres_operator_crunchydata_com_instance,
            ]
          targetLabel: deployment
        - sourceLabels:
            [__meta_kubernetes_pod_label_postgres_operator_crunchydata_com_role]
          targetLabel: role
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: instance
  # Scrapes the node-local cluster only. The old postgres-forgejo is the idle
  # rollback target until the 14-day soak ends (plan phase 4) and has no
  # scheduled backups, so scraping it only fires PostgresIncrBackupStale.
  # Point this back at it if the cutover is rolled back.
  selector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: postgres-forgejo-local
      postgres-operator.crunchydata.com/crunchy-postgres-exporter: "true"
