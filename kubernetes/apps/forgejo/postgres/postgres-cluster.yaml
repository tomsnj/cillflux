---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres-forgejo
  namespace: forgejo
spec:
  postgresVersion: 16

  # Adds the postgres-exporter sidecar (default operator image, port
  # "exporter"); scraped by podmonitor.yaml.
  monitoring:
    pgmonitor:
      exporter: {}

  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gsks1
        resources:
          requests:
            storage: 5Gi

  backups:
    pgbackrest:
      global:
        repo1-retention-full: "7"
        repo1-retention-full-type: count
      repos:
        - name: repo1
          schedules:
            full: "30 1 * * *"
            incremental: "10 * * * *"
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              storageClassName: gsks1
              resources:
                requests:
                  storage: 5Gi

  users:
    - name: forgejo
      databases:
        - forgejo
      options: "SUPERUSER"
