---
# Standalone Postgres for Immich - NOT managed by CrunchyData PGO like the
# rest of the cluster's databases. Immich requires a Postgres image with the
# vectorchord/pgvecto.rs extension compiled in (ghcr.io/immich-app/postgres),
# which is not compatible with PGO's image expectations (PGO's own tooling -
# Patroni, pgBackRest - assumes its own crunchy-postgres image layout).
# Single pod, no HA (this is a single-node cluster anyway, so PGO's Patroni
# failover isn't providing real HA today either). Backed up via Volsync
# instead of pgBackRest - see volsync.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gsks0
  resources:
    requests:
      storage: 20Gi
---
# The node's NVMe via local-hostpath, not NFS. Live data directory
# from 2026-09-18 until 2026-09-26, and now the **PostgreSQL 14
# rollback** for the 14 -> 17 migration.
#
# Postgres cannot read a v14 data directory with a v17 binary, so that
# upgrade was a logical dump/restore onto the pg17 PVC below. This
# volume was never written to by it: rolling back is reverting the
# image and the claimName, nothing more.
#
# Do NOT delete this block until the cutover has proven itself for a
# week - Flux prunes by inventory diff, so removing it here destroys
# the volume and the rollback with it. See
# docs/plan-immich-postgres-pg17.md phase 5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data-nvme
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 20Gi
---
# Live data directory since 2026-09-26: PostgreSQL 17.6, restored from
# a logical dump of the v14 database. WaitForFirstConsumer binding, so
# this stays Pending until the Postgres pod mounts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data-nvme-pg17
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  # Recreate, not RollingUpdate - this is a single RWO PVC, two postgres
  # pods must never mount it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.0@sha256:51f6abbfc720dde5cad9a39133d1c5247da8f073a449004da781c07b2cd9ee9c
          envFrom:
            - secretRef:
                name: immich-postgres-secret
          env:
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          # timeoutSeconds/failureThreshold are explicit, not defaulted.
          # k8s defaults these to 1s/3, and an exec probe on this NFS-
          # backed PVC (gsks0, ~78 IOPS HDD mirror) blows past 1s under
          # bulk write load - pg_isready then "fails", kubernetes pulls
          # this single-replica pod from the Service endpoints, and
          # immich-server loses its database mid-request, surfacing as
          # 502 at the ingress. Cost 7 RAW uploads during the
          # 2026-09-11 Google Takeout import; same root cause as the
          # immich-server probe fix in the app HelmRelease. See the
          # single-replica probe gotcha in docs/CLUSTER.md.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            # Moved off gsks0 (NFS, ~78 IOPS HDD mirror) to the Talos
            # node's NVMe on 2026-09-18. The database shared spindles
            # with the 1Ti photo library, and bulk imports starved it:
            # pg_isready went unanswered past its liveness budget,
            # Postgres was SIGKILLed, and immich-server crash-looped
            # behind it. Recurred even at --concurrent-tasks 1 and with
            # facialRecognition paused, so it was contention, not
            # client behaviour. Same split Frigate already uses: bulk
            # media on NFS, hot database local.
            # Tradeoff: primary and restic snapshots now share the
            # node's disk, so pgdump.yaml writes a nightly logical dump
            # to gsks1 for a second failure domain. See
            # docs/proposal-immich-postgres-nvme.md.
            #
            # Two earlier volumes are deliberately retained above as
            # rollbacks: immich-postgres-data (gsks0, pre-NVMe) and
            # immich-postgres-data-nvme (the PG14 directory, pre-17).
            claimName: immich-postgres-data-nvme-pg17
        # Matches upstream docker-compose's shm_size: 128mb
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
