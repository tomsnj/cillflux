---
# Standalone Postgres for Immich - NOT managed by CrunchyData PGO like the
# rest of the cluster's databases. Immich requires a Postgres image with the
# vectorchord/pgvecto.rs extension compiled in (ghcr.io/immich-app/postgres),
# which is not compatible with PGO's image expectations (PGO's own tooling -
# Patroni, pgBackRest - assumes its own crunchy-postgres image layout).
# Single pod, no HA (this is a single-node cluster anyway, so PGO's Patroni
# failover isn't providing real HA today either). Backed up via Volsync
# instead of pgBackRest - see volsync.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gsks0
  resources:
    requests:
      storage: 20Gi
---
# Live data directory since 2026-09-18 - the node's NVMe via
# local-hostpath, not NFS. See the claimName comment below for why.
# WaitForFirstConsumer binding, so this stays Pending until the
# Postgres pod mounts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data-nvme
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  # Recreate, not RollingUpdate - this is a single RWO PVC, two postgres
  # pods must never mount it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
          envFrom:
            - secretRef:
                name: immich-postgres-secret
          env:
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          # timeoutSeconds/failureThreshold are explicit, not defaulted.
          # k8s defaults these to 1s/3, and an exec probe on this NFS-
          # backed PVC (gsks0, ~78 IOPS HDD mirror) blows past 1s under
          # bulk write load - pg_isready then "fails", kubernetes pulls
          # this single-replica pod from the Service endpoints, and
          # immich-server loses its database mid-request, surfacing as
          # 502 at the ingress. Cost 7 RAW uploads during the
          # 2026-09-11 Google Takeout import; same root cause as the
          # immich-server probe fix in the app HelmRelease. See the
          # single-replica probe gotcha in docs/CLUSTER.md.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            # Moved off gsks0 (NFS, ~78 IOPS HDD mirror) to the Talos
            # node's NVMe on 2026-09-18. The database shared spindles
            # with the 1Ti photo library, and bulk imports starved it:
            # pg_isready went unanswered past its liveness budget,
            # Postgres was SIGKILLed, and immich-server crash-looped
            # behind it. Recurred even at --concurrent-tasks 1 and with
            # facialRecognition paused, so it was contention, not
            # client behaviour. Same split Frigate already uses: bulk
            # media on NFS, hot database local.
            # Tradeoff: primary and restic snapshots now share the
            # node's disk, so pgdump.yaml writes a nightly logical dump
            # to gsks1 for a second failure domain. The old
            # immich-postgres-data PVC is deliberately retained as
            # rollback. See docs/proposal-immich-postgres-nvme.md.
            claimName: immich-postgres-data-nvme
        # Matches upstream docker-compose's shm_size: 128mb
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
