---
# Second, independent backup path for the Immich database.
#
# Volsync/restic already snapshots the immich-postgres-data PVC into
# MinIO - but MinIO lives on the Talos node's NVMe. Once Postgres
# itself moves to local-hostpath (see
# docs/proposal-immich-postgres-nvme.md), its primary data and its
# restic snapshots would share one physical disk, and that database
# holds every album, face cluster and piece of metadata from the 2026
# photo migration.
#
# This lands a logical dump on gsks1 (TrueNAS) instead:
#   - different failure domain - the NAS, not the node
#   - different format - a logical dump survives a corrupted data
#     directory that restic would faithfully preserve
# Cheap to run: the database is ~450 MB and compresses hard.
#
# Scheduled at 02:30, ahead of the 03:00 Volsync run, so a fresh dump
# is on disk before the filesystem snapshot is taken.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-dumps
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gsks1
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-dump
  namespace: immich
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              # Same image as the server, so pg_dump matches the
              # server version exactly - a newer/older client can
              # refuse outright.
              image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.0@sha256:51f6abbfc720dde5cad9a39133d1c5247da8f073a449004da781c07b2cd9ee9c
              env:
                - name: PGHOST
                  value: immich-postgres.immich.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: DB_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-secret
                      key: DB_DATABASE_NAME
              command:
                - /bin/sh
                - -c
                # NOTE: every shell $ is escaped as $$ so Flux's
                # postBuild envsubst leaves it alone. Unescaped, Flux
                # treats ${ts} etc. as its own variables and the whole
                # cluster-apps kustomization fails in strict mode with
                # 'variable not set'. See CLUSTER.md gotchas.
                - |
                  set -eu
                  ts="$$(date +%Y%m%d-%H%M)"
                  out="/dumps/immich-$${ts}.dump"
                  echo "dumping $${PGDATABASE} -> $${out}"
                  # -Fc = custom format: compressed, and restorable
                  # selectively with pg_restore.
                  pg_dump -Fc -f "$${out}.partial"
                  # Rename only on success, so a failed or truncated
                  # run never leaves a file that looks like a backup.
                  mv "$${out}.partial" "$${out}"
                  # stat, not du: du reports ALLOCATED BLOCKS, and on
                  # this NFS-backed gsks1 volume that is read before
                  # writeback completes - the 2026-09-26 run logged
                  # "wrote 512" for a file that was a full 190 MB and
                  # restored cleanly. A backup log that reads like a
                  # truncated backup is worse than no log. stat -c %s
                  # reports st_size, which is correct immediately.
                  sz=$$(stat -c %s "$${out}")
                  echo "wrote $${out} - $${sz} bytes ($$((sz / 1048576)) MiB)"
                  # Keep 7 most recent; prune the rest.
                  ls -1t /dumps/immich-*.dump 2>/dev/null | tail -n +8 | while read -r old; do
                    echo "pruning $${old}"
                    rm -f "$${old}"
                  done
                  # Clear any .partial left by an earlier crash.
                  find /dumps -name '*.partial' -mtime +1 -delete 2>/dev/null || true
                  echo "retained:"
                  # ls -l (st_size), not ls -s (allocated blocks) - same
                  # trap as du above.
                  ls -1lh /dumps/immich-*.dump 2>/dev/null || true
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: immich-postgres-dumps
