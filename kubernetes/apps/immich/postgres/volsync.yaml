---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-postgres-data
  namespace: immich
spec:
  # MUST track the claim the Postgres deployment actually mounts.
  # The 2026-09-18 move to NVMe repointed the deployment but initially
  # left this naming the old gsks0 PVC - Volsync would have kept
  # reporting successful nightly backups of a frozen copy. If the data
  # directory is ever moved again, change this in the same commit.
  # Must track the claimName in postgres.yaml. This does NOT follow it
  # automatically: when the database moved to the pg17 PVC on
  # 2026-09-26 this still named the old volume, which would have meant
  # faithfully backing up a frozen v14 directory while the live
  # database went unprotected, with nothing reporting an error.
  sourcePVC: immich-postgres-data-nvme-pg17
  trigger:
    schedule: "0 3 * * *"
  # The mover must run as the postgres user. PGDATA is mode 0700 owned
  # by uid 999, and on the node's local disk (since the 2026-09-18 NVMe
  # move) that is enforced strictly - the default mover uid got
  # "ls: cannot open directory '/data': Permission denied" and every
  # backup failed. It worked on NFS only because the export's squashing
  # masked the permissions.
  restic:
    moverSecurityContext:
      runAsUser: 999
      runAsGroup: 0
      fsGroup: 0
    copyMethod: Direct
    pruneIntervalDays: 7
    repository: volsync-immich-postgres-data
    storageClassName: gsks1
    cacheStorageClassName: local-hostpath
    retain:
      daily: 7
      weekly: 4
      monthly: 3
