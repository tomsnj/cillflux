---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
data:
  # airOS (BusyBox-based) logs "syslogd started: BusyBox v..." exactly
  # once per boot, since syslogd itself restarts fresh every time the
  # device powers on -- so each occurrence is a reboot. Provisional:
  # written before any real NanoStation log reached Loki, verified only
  # against a synthetic test line and a known airOS community log
  # sample, not this specific device's own output. Re-check the match
  # string against {job="nanostation"} in Loki once a real reboot has
  # been logged.
  nanostation.yaml: |
    groups:
      - name: nanostation
        rules:
          - alert: NanoStationRepeatedReboots
            expr: |
              sum(count_over_time({job="nanostation"} |= "syslogd started" [24h])) > 1
            labels:
              severity: warning
            annotations:
              summary: "NanoStation 5AC has rebooted {{ $value }} times in the last 24h."
              description: >-
                {{ $value }} syslogd-start events from the NanoStation
                5AC syslog stream in the last 24 hours -- each one is the
                device rebooting, so this fires from the second reboot
                onward. That matches the pattern that has needed a
                manual power cycle. Check {job="nanostation"} in Loki
                Explore around each event for what preceded it (kernel
                panic, watchdog, DFS radar detection, etc).
