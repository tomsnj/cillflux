---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
data:
  # Confirmed 2026-10-02 against a real boot log pulled directly off the
  # device (interactively, not via this pipeline). "syslogd started:
  # BusyBox v..." is NOT a once-per-boot marker as first assumed -- it
  # appeared TWICE in a single clean boot (once during airOS's early
  # provmode init, again after the real init takes over), which would
  # have false-fired this alert on every single reboot. The "system"
  # tag's "Start" message appeared exactly once, right at the point
  # init takes over for good, so that's the marker used instead.
  #
  # Matches on the app="system" label (promoted from the syslog TAG
  # field in config.alloy's loki.relabel), not a "system: Start"
  # substring -- confirmed live that Alloy's RFC3164 parser strips the
  # "TAG: " prefix from the stored line text, so that substring can
  # never appear in the message body.
  nanostation.yaml: |
    groups:
      - name: nanostation
        rules:
          - alert: NanoStationRepeatedReboots
            expr: |
              sum(count_over_time({job="nanostation", app="system"} |= "Start" [24h])) > 1
            labels:
              severity: warning
            annotations:
              summary: "NanoStation 5AC has rebooted {{ $value }} times in the last 24h."
              description: >-
                {{ $value }} boot events from the NanoStation 5AC
                syslog stream in the last 24 hours -- each one is the
                device rebooting, so this fires from the second reboot
                onward. That matches the pattern that has needed a
                manual power cycle. Check {job="nanostation"} in Loki
                Explore around each event for what preceded it (kernel
                panic, watchdog, DFS radar detection, etc).
