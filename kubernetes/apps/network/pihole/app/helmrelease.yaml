---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  interval: 5m
  chart:
    spec:
      chart: pihole
      # Pin explicitly. An unset version resolves to '*' (newest in the repo)
      # on every reconcile. This is household DNS - an unattended chart upgrade
      # takes the whole house offline. Bump only via a reviewed Renovate PR.
      version: 2.0.14
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    image:
      repository: docker.io/pihole/pihole
      tag: 2026.10.0
    pihole:
      upstreamDns: "1.1.1.1;8.8.8.8"
    serviceWeb:
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: 10.0.10.5
#      loadBalancerIP: 10.0.10.5
#      http:
#        enabled: true
#        port: 80
#      https:
#        enabled: false
    serviceDns:
      mixedService: true
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: 10.0.10.6
      loadBalancerIP: 10.0.10.6
      port: 53
    serviceDhcp:
      enabled: false
    virtualHost: "pihole.${SECRET_DOMAIN}"
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        hajimari.io/icon: simple-icons:pihole
        # Pi-hole FTL 6.8 (image 2026.10.0) answers 404 at "/" (the review
        # script's notes say it was 403 before); its release notes list "/"
        # now honouring webserver.serve_all=false. Send bare "/" to the admin
        # UI instead, which also keeps the ingress check in
        # weekly-renovate-review.sh green (302 is accepted).
        nginx.ingress.kubernetes.io/app-root: /admin/
      hosts:
        - host: "pihole.${SECRET_DOMAIN}"
      tls:
        - hosts:
            - "pihole.${SECRET_DOMAIN}"
    persistence:
      enabled: true
      storageClass: gsks0
      size: 1Gi
    adminPassword: "${PIHOLE_ADMIN_PASSWORD}"
    adlists: {}
    dns:
      customDnsmasq:
        - "local=/gs-farm.net/"
        - "address=/gs-farm.net/10.0.10.1"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
