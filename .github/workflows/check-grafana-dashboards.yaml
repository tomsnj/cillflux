name: Check Grafana Dashboard URLs

# Periodically verifies that every dashboard URL referenced by the Grafana
# download_dashboards.sh init container (kubernetes/apps/observability/grafana)
# still resolves. Upstream repos occasionally rename/move dashboard JSON files
# (e.g. monitoring-mixins/website switching cert-manager sources), which breaks
# the init container in a way that's easy to miss until Grafana crash-loops.
#
# If any URL fails, opens (or updates) a single tracking issue rather than
# spamming a new issue on every run.

on:
  schedule:
    # Every Sunday at 09:00 UTC
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dashboard URLs
        id: check
        run: |
          set -uo pipefail

          # Keep this list in sync with:
          #   kubernetes/apps/observability/grafana/app/helmrelease.yaml (dashboards: block)
          # If you add/remove/rename a dashboard source there, update it here too.
          urls=(
            "https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager-overview.json"
            "https://grafana.com/api/dashboards/17457/revisions/6/download"
            "https://grafana.com/api/dashboards/15038/revisions/1/download"
            "https://grafana.com/api/dashboards/1860/revisions/31/download"
            "https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json"
            "https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json"
            "https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json"
            "https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/nginx.json"
            "https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/request-handling-performance.json"
          )

          failures=""
          summary=""

          for url in "${urls[@]}"; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 "$url" || echo "000")
            summary+="${code}  ${url}"$'\n'
            if [ "$code" != "200" ]; then
              failures+="- \`${code}\` ${url}"$'\n'
            fi
          done

          echo "## Dashboard URL check results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failures" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failures<<EOF"
              echo "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue on failure
        if: steps.check.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const failures = `${{ steps.check.outputs.failures }}`;
            const title = "Grafana dashboard source URL(s) broken";
            const body = [
              "The scheduled dashboard URL check found one or more failing sources for the",
              "`download-dashboards` init container in `kubernetes/apps/observability/grafana`.",
              "",
              "This means the Grafana pod will crash-loop on its next restart (or already is).",
              "",
              "**Failing URLs:**",
              failures,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Update the corresponding entry in `kubernetes/apps/observability/grafana/app/helmrelease.yaml`",
              "(and the URL list in `.github/workflows/check-grafana-dashboards.yaml`), then close this issue.",
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "grafana-dashboards",
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["grafana-dashboards"],
              });
            }

      - name: Close stale issue on success
        if: steps.check.outputs.has_failures == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "grafana-dashboards",
            });

            for (const issue of existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "All dashboard URLs resolved successfully on the latest scheduled check — closing.",
              });
            }
