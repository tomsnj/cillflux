name: "Flux Diff"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        paths: ["kubernetes"]
        resources: ["hr", "ks"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Diff Resources
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            ghcr.io/home-operations/flate@sha256:91c31f5d64c82be1d252637ec512302120e49e19831093f2907d5679c3136d17 \
            diff ${{ matrix.resources }} \
            -o diff \
            --path /github/workspace/pull/${{ matrix.paths }} \
            --path-orig /github/workspace/default/${{ matrix.paths }} \
            > diff.patch

      - name: Check diff size
        id: diff
        run: |
          cat diff.patch
          # cap the whole comment well under GitHub's ~65KB comment limit
          head -c 60000 diff.patch > diff-truncated.patch
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            printf '\n... (diff truncated — see full patch in the workflow run logs)\n' >> diff-truncated.patch
          fi
          echo "nonempty=$( [ -s diff.patch ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.diff.outputs.nonempty == 'true' }}
        name: Add comment
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.paths }}/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message-path: diff-truncated.patch
